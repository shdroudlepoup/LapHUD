name: release

# Publier une version :  git tag v0.1.0 && git push origin v0.1.0
# GitHub compile alors LapHUD pour Windows, macOS et Linux et joint les fichiers à la release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libfontconfig1 libxkbcommon-x11-0
      - run: pip install -r requirements.txt pyinstaller pillow
      - run: python -m unittest discover -s tests -t .
      - run: pyinstaller --noconfirm LapHUD.spec

      - name: Windows — zip avec ffmpeg inclus
        if: runner.os == 'Windows'
        run: |
          curl -sSL -o ff.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          unzip -q ff.zip -d ff
          python packaging/build_release.py "$(ls -d ff/*/bin)"
          mv _release/LapHUD-*-windows.zip "_release/LapHUD-${GITHUB_REF_NAME}-windows.zip"

      - name: macOS — LapHUD.app
        if: runner.os == 'macOS'
        run: |
          mkdir -p _release
          ditto -c -k --keepParent dist/LapHUD.app "_release/LapHUD-${GITHUB_REF_NAME}-macos.zip"

      - name: Linux — archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p _release
          cp LICENSE packaging/LISEZMOI.txt dist/LapHUD/
          tar czf "_release/LapHUD-${GITHUB_REF_NAME}-linux.tar.gz" -C dist LapHUD

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            _release/*.zip
            _release/*.tar.gz
